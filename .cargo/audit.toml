[advisories]
ignore = [
  # rsa 0.9.10 lands in Cargo.lock via sqlx -> sqlx-mysql -> … -> rsa even though
  # we only enable sqlx's `sqlite` feature (rsa is not linked into our binary).
  # No patched rsa release exists yet. Remove once sqlx stops resolving sqlx-mysql
  # into the lockfile for sqlite-only builds, or rsa ships a fix.
  "RUSTSEC-2023-0071",
]
