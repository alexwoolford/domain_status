[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # parquet still pulls paste transitively (through 59.x); remove once arrow/parquet drops it.
    "RUSTSEC-2024-0436",
]

# Dependency license policy (not the project license — domain_status is MIT).
# Checked by `just deny` / CI. Non-crate data (fingerprints, gitleaks rules,
# MaxMind) is documented in docs/LICENSES.md and is outside cargo-deny scope.
[licenses]
confidence-threshold = 0.8
allow = [
    # MIT / Apache (majority of the graph; many crates are dual-licensed)
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # BSD family
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    # Other permissive
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    # Data / weak copyleft used by specific crates
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
