version: 2
updates:
  # Enable version updates for Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "alexwoolford"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group updates to reduce PR noise
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor:
        patterns:
          - "*"
        update-types:
          - "minor"
    # Ignore major version updates (review manually)
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Transitive via parquet (^0.17). Dependabot tries 0.23+/0.24 and fails
      # because nothing newer is compatible; that surfaces as a red "Dependabot
      # Updates" run on main (including after releases) without an actionable PR.
      - dependency-name: "thrift"
