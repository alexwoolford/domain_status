# Pre-commit hooks configuration
# Install: brew install pre-commit  (or pipx/pip)
# Then: just install-hooks   # or: pre-commit install

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks
        args: ['--verbose', '--redact', '--no-banner', '--staged']
        description: "Detect hardcoded secrets before commit"
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1000']
        description: "Prevent committing large files"
      - id: check-json
        description: "Validate JSON files"
      - id: check-yaml
        description: "Validate YAML files"
      - id: end-of-file-fixer
        description: "Ensure files end with newline"
      - id: trailing-whitespace
        description: "Remove trailing whitespace"
      - id: check-merge-conflict
        description: "Check for merge conflict markers"

  # Mirror CI Lint: fail locally before push (same as `just fmt-check` / `just lint`).
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-clippy
        name: cargo clippy -D warnings
        entry: cargo clippy --all-targets --all-features --locked -- -D warnings
        language: system
        pass_filenames: false
        always_run: true
