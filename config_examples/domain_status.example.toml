# Example configuration for domain_status (optional).
#
# Use: --config path/to/this/file
# Precedence: CLI > DOMAIN_STATUS_* env (clap) > this file > defaults.
# `--config` wins over DOMAIN_STATUS_CONFIG_FILE.
#
# Copy to domain_status.toml in the cwd, or:
#   domain_status scan --config ./domain_status.toml urls.txt
#
# Prefer CLI day-to-day; for repeatable jobs pick TOML *or* env (not both for the
# same knobs unless you intentionally override). Secrets stay in env / .env.
#
# Note: `file` is used by the library Config default / non-CLI embeds.
# The CLI scan command always requires a positional URL list (`urls.txt` or `-`).

# file          = "urls.txt"           # library / embeds only; CLI uses positional arg
# db_path       = "./domain_status.db"
# cache_dir     = "/var/cache/domain_status"   # optional; else platform cache (Linux ~/.cache/domain_status, macOS ~/Library/Caches/domain_status)
# max_concurrency = 30
# timeout_seconds = 10
# drain_timeout_secs = 10
# user_agent    = "domain_status/0.1"
# rate_limit_rps = 15
# log_level     = "info"               # or use CLI -v / -q
# log_format    = "plain"              # plain | json (scan log file)
# log_file      = "domain_status.log"
# fingerprints  = "/path/to/technologies"
# geoip         = "/path/to/GeoLite2-City.mmdb"
# status_port   = 8080
# enable_whois  = true                 # on by default; CLI --no-whois forces off
# scan_external_scripts = false
# fail_on       = "never"              # never | any-failure | any_failure | pct>
# fail_on_pct_threshold = 10
